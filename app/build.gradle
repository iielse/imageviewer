apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace 'com.github.iielse.imageviewer.demo'
    compileSdk 36

    defaultConfig {
        minSdk 21
        targetSdk 36
        versionCode 219
        versionName "2.1.23"
        applicationId "com.github.iielse.imageviewer.demo"
    }
    buildFeatures.viewBinding = true
    lintOptions {
        disable 'SpUsage', 'NotifyDataSetChanged', 'SetTextI18n', 'SimpleDateFormat',
                'Deprecated', 'ClickableViewAccessibility', 'InflateParams', 'HardcodedText',
                'ContentDescription', 'ObsoleteSdkInt', 'Deprecated in Java', 'unused', 'QueryPermissionsNeeded',
                'UseAppTint', 'SetJavaScriptEnabled', 'CustomX509TrustManager'
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.paging:paging-runtime-ktx:3.3.6'

    implementation 'com.github.bumptech.glide:glide:4.13.1'
    kapt 'com.github.bumptech.glide:compiler:4.13.1'
    implementation 'com.github.chrisbanes:PhotoView:2.2.0'
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'

    implementation project(':imageviewer')
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.19'
}

